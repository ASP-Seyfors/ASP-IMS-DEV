<div id="addressBookModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
  <div style="background:#fff; border-radius:8px; width:100%; max-width:800px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.6);">
    
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #8e24aa; padding:15px 20px; flex-shrink:0;">
      <h2 style="margin:0; color:#8e24aa; display:flex; align-items:center; gap:8px;">
        <i data-lucide="book-open" style="width:24px; height:24px;"></i> Address Book Manager
      </h2>
      <button onclick="document.getElementById('addressBookModal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#333;">&times;</button>
    </div>

    <div style="overflow-y:auto; padding:20px; flex-grow:1; background:#f5f5f5;">
      
      <!-- Entry Form -->
      <div style="background:#fff; padding:15px; border-radius:6px; border:1px solid #ccc; margin-bottom:20px;">
        <h4 style="margin:0 0 10px 0; color:#0277bd;">Add / Edit Contact</h4>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="text" id="abContactId" class="form-input" placeholder="Contact ID (System Key)*" style="font-weight:bold; border-color:#0277bd;">
            <input type="text" id="abCompany" class="form-input" placeholder="Formal Company Name">
            <input type="text" id="abContactName" class="form-input" placeholder="Contact Person">
            <input type="text" id="abEmail" class="form-input" placeholder="Email Address">
            <input type="text" id="abPhone" class="form-input" placeholder="Phone Number">
            <div style="display:flex; gap:8px;">
                <select id="abMethod" class="form-input" style="flex:1;">
                    <option value="FEDEX">FedEx</option>
                    <option value="UPS">UPS</option>
                </select>
                <input type="text" id="abAccount" class="form-input" placeholder="Shipping Account #" style="flex:2;">
            </div>
            
            <input type="text" id="abAddress1" class="form-input" placeholder="Address Line 1" style="grid-column: 1 / -1;">
            <input type="text" id="abAddress2" class="form-input" placeholder="Address Line 2" style="grid-column: 1 / -1;">
            
            <div style="display:flex; gap:8px; grid-column: 1 / -1;">
                <input type="text" id="abCity" class="form-input" placeholder="City" style="flex:3;">
                <input type="text" id="abState" class="form-input" placeholder="ST" style="flex:1;">
                <input type="text" id="abZip" class="form-input" placeholder="Zip" style="flex:2;">
                <input type="text" id="abCountry" class="form-input" placeholder="Country" value="US" style="flex:1;">
            </div>
            
            <textarea id="abNotes" class="form-input" placeholder="Shipping Notes / Terms" style="grid-column: 1 / -1; height:40px; resize:none;"></textarea>

            <div style="grid-column: 1 / -1; display:flex; gap:10px;">
                <button class="btn-small" style="background:#757575; color:#fff; flex:1; padding:8px;" onclick="ReportsManager.clearAddressBookForm()">Clear Form</button>
                <button id="btnSaveAbEntry" class="btn-small" style="background:#2e7d32; color:#fff; flex:3; padding:8px;" onclick="ReportsManager.saveAddressBookEntry()">💾 Save to Database</button>
            </div>
        </div>
      </div>

      <!-- Live Roster Grid -->
      <h4 style="margin:0 0 10px 0; color:#333;">Saved Contacts (<span id="abContactCount">0</span>)</h4>
      <div id="addressBookGrid" style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px;">
          <!-- JS will inject cards here -->
      </div>
      
      <div style="border-top: 1px solid #ccc; padding-top: 15px; text-align: right;">
          <button class="btn-action btn-cancel btn-auto" style="margin:0;" onclick="document.getElementById('addressBookModal').style.display='none'">Close Address Book</button>
      </div>

    </div>
  </div>
</div>
