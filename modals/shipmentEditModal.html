<div id="shipmentEditModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
  <div style="background:#fff; border-radius:8px; width:100%; max-width:500px; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.6);">
    
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #0277bd; padding:15px 20px;">
      <h2 id="shipEditTitle" style="margin:0; color:#0277bd; font-size:1.2rem;">Edit Shipment</h2>
      <button onclick="document.getElementById('shipmentEditModal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#333;">&times;</button>
    </div>

    <div style="padding:20px; display:flex; flex-direction:column; gap:12px;">
      <input type="hidden" id="shipEditType">
      <input type="hidden" id="shipEditRowIdx">
      
      <div style="display:flex; gap:10px;">
          <div style="flex:1;">
              <label style="font-size:0.8rem; font-weight:bold; color:#555;">Date</label>
              <input type="text" id="shipEditDate" class="form-input">
          </div>
          <div style="flex:1;">
              <label style="font-size:0.8rem; font-weight:bold; color:#555;">Status</label>
              <select id="shipEditStatus" class="form-input">
                  <option value="Pending">Pending</option>
                  <option value="In Transit">In Transit</option>
                  <option value="Delivered">Delivered</option>
                  <option value="Cancelled">Cancelled</option>
              </select>
          </div>
      </div>
      
      <div>
          <label style="font-size:0.8rem; font-weight:bold; color:#555;">Partner / Company</label>
          <input type="text" id="shipEditPartner" class="form-input" style="font-weight:bold;">
      </div>

      <div style="display:flex; gap:10px;">
          <div style="flex:1;">
              <label style="font-size:0.8rem; font-weight:bold; color:#555;">PO / Invoice</label>
              <input type="text" id="shipEditPo" class="form-input">
          </div>
          <div style="flex:1;">
              <label style="font-size:0.8rem; font-weight:bold; color:#555;">Carrier</label>
              <input type="text" id="shipEditCarrier" class="form-input">
          </div>
      </div>

      <div>
          <label style="font-size:0.8rem; font-weight:bold; color:#555;">Tracking Number</label>
          <input type="text" id="shipEditTracking" class="form-input" style="font-family:monospace;">
      </div>

      <div>
          <label style="font-size:0.8rem; font-weight:bold; color:#555;">ETA Date</label>
          <input type="text" id="shipEditEta" class="form-input">
      </div>

      <div>
          <label style="font-size:0.8rem; font-weight:bold; color:#555;">Notes</label>
          <input type="text" id="shipEditNotes" class="form-input">
      </div>

      <div id="shipEditOutboundExtra" style="display:none; gap:10px;">
          <div style="flex:1;">
              <label style="font-size:0.8rem; font-weight:bold; color:#555;">Weight (lbs)</label>
              <input type="text" id="shipEditWeight" class="form-input">
          </div>
          <div style="flex:2;">
              <label style="font-size:0.8rem; font-weight:bold; color:#555;">Dims (LxWxH)</label>
              <input type="text" id="shipEditDims" class="form-input">
          </div>
      </div>

      <button id="btnSaveShipmentEdit" class="btn-action" style="background:#0277bd; color:#fff; padding:10px; width:100%; border:none; font-weight:bold; border-radius:4px; margin-top:10px;" onclick="saveShipmentEdit()">💾 Save Changes to Database</button>

    </div>
  </div>
</div>
