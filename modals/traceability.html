<div id="shipmentTrackingModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; display:none; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
  <div style="background:var(--card-bg, #ffffff); border-radius:8px; width:100%; max-width:800px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.5);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #0277bd; padding-bottom:8px; margin-bottom:15px;">
      <h2 style="margin:0; color:#0277bd; display:flex; align-items:center; gap:8px;">
        <i data-lucide="truck" style="width:24px; height:24px;"></i> Active Shipments Hub
      </h2>
      <button onclick="document.getElementById('shipmentTrackingModal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main, #333);">&times;</button>
    </div>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <!-- INCOMING -->
        <div style="flex: 1; background: #fff3e0; padding: 15px; border-radius: 6px; border: 1px solid #ffcc80;">
            <h4 style="color: #e65100; margin-top: 0; border-bottom: 2px solid #ffcc80; padding-bottom: 5px;">📥 Incoming (Pending)</h4>
            <div id="trackIncomingList" style="max-height: 400px; overflow-y: auto; font-size: 0.85rem;"></div>
        </div>
        
        <!-- OUTGOING -->
        <div style="flex: 1; background: #e8f5e9; padding: 15px; border-radius: 6px; border: 1px solid #81c784;">
            <h4 style="color: #2e7d32; margin-top: 0; border-bottom: 2px solid #81c784; padding-bottom: 5px;">📤 Outgoing (Pending)</h4>
            <div id="trackOutgoingList" style="max-height: 400px; overflow-y: auto; font-size: 0.85rem;"></div>
        </div>
    </div>
  </div>
</div>
