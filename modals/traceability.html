<div id="shipmentTrackingModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 800px;">
        <span class="close" onclick="document.getElementById('shipmentTrackingModal').style.display='none'">&times;</span>
        <h2 style="color: #0277bd; margin-top: 0;"><i data-lucide="truck"></i> Active Shipments Hub</h2>
        
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <!-- INCOMING -->
            <div style="flex: 1; background: #fff3e0; padding: 15px; border-radius: 6px; border: 1px solid #ffcc80;">
                <h4 style="color: #e65100; margin-top: 0; border-bottom: 2px solid #ffcc80; padding-bottom: 5px;">📥 Incoming (Pending)</h4>
                <div id="trackIncomingList" style="max-height: 400px; overflow-y: auto; font-size: 0.85rem;"></div>
            </div>
            
            <!-- OUTGOING -->
            <div style="flex: 1; background: #e8f5e9; padding: 15px; border-radius: 6px; border: 1px solid #a5d6a7;">
                <h4 style="color: #2e7d32; margin-top: 0; border-bottom: 2px solid #a5d6a7; padding-bottom: 5px;">📤 Outgoing (Pending)</h4>
                <div id="trackOutgoingList" style="max-height: 400px; overflow-y: auto; font-size: 0.85rem;"></div>
            </div>
        </div>
    </div>
</div>
