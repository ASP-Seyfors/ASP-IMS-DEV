<div id="stockReportEditorModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; display:none; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
  <div style="background:#fff; border-radius:8px; width:100%; max-width:700px; max-height:90vh; overflow-y:auto; padding:20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #7b1fa2; padding-bottom:8px; margin-bottom:15px;">
      <h3 style="margin:0; color:#7b1fa2;" id="stockReportTitle">📄 Build "Customer Inventory Stock Report"</h3>
      <button onclick="document.getElementById('stockReportEditorModal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <div id="stockReportHeaderBox" style="background:#f3e5f5; border:1px solid #ce93d8; border-radius:4px; padding:10px; margin-bottom:15px; font-size:0.85rem;">
      <!-- Dynamic instructions injected here -->
    </div>
    <div style="margin-bottom:15px; background:#fafafa; border:1px solid #ddd; padding:10px; border-radius:4px; display:flex; flex-wrap:wrap; gap:15px;">
      <label style="font-weight:bold; cursor:pointer; font-size:0.85rem; color:#333;"><input type="checkbox" id="chkIncludeDescFlyer" checked> Include Description</label>
      <label style="font-weight:bold; cursor:pointer; font-size:0.85rem; color:#333;"><input type="checkbox" id="chkIncludeQtyFlyer" checked> Include Quantity</label>
      <label style="font-weight:bold; cursor:pointer; font-size:0.85rem; color:#333;"><input type="checkbox" id="chkIncludePriceInReport" checked> Include Unit Price</label>
    </div>
    <div id="stockReportNoteContainer" style="margin-bottom:10px; display:none;">
      <label style="font-size:0.85rem; font-weight:bold; color:#0277bd;">📝 Add Flyer Note / Intro Text:</label>
      <textarea id="flyerNoteInput" rows="3" style="width:100%; padding:8px; font-size:0.85rem; resize:vertical;" placeholder="e.g. Good morning, we have the following items in stock..."></textarea>
    </div>
    <div id="stockReportActionRow" style="display:none; justify-content:space-between; align-items:center; margin-bottom:8px; padding: 0 4px;">
      <strong style="font-size:0.9rem; color:#333;" id="stockReportItemCount">Available Inventory</strong>
      <div>
        <button class="btn-small btn-auto" style="background:#0277bd; color:#fff; padding:4px 8px;" onclick="document.querySelectorAll('.flyer-chk').forEach(c => c.checked = true)">Select All</button>
        <button class="btn-small btn-auto" style="background:#757575; color:#fff; padding:4px 8px;" onclick="document.querySelectorAll('.flyer-chk').forEach(c => c.checked = false)">Deselect All</button>
      </div>
    </div>

    <!-- SEARCH BAR -->
    <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
      <input type="text" id="flyerSearchBox" onkeyup="ReportsManager.filterFlyerItems()" placeholder="🔍 Search by REF or Description..." style="flex: 1; padding: 8px; font-size: 0.85rem; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
      <label style="font-size: 0.85rem; font-weight: bold; cursor: pointer; color: #0277bd; white-space: nowrap; background: #e3f2fd; padding: 6px 10px; border-radius: 4px; border: 1px solid #bfe0fb;">
        <input type="checkbox" id="chkShowSelectedFlyer" onchange="ReportsManager.filterFlyerItems()" style="vertical-align: middle;"> Show Selected Only
      </label>
    </div>

    <!-- ROWS CONTAINER (Only one!) -->
    <div id="reportItemRowsContainer" style="max-height:300px; overflow-y:auto; border:1px solid #ccc; padding:6px; border-radius:4px; background:#fff;">
      <!-- Dynamic rows injected here -->
    </div>

    <!-- ACTION BUTTONS -->
    <button id="btnAddFlyerRow" onclick="ReportsManager.addBlankRowToReportEditor()" style="background:#0277bd; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-size:0.8rem; margin-top:8px; cursor:pointer;">+ Add Item to Flyer</button>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px; border-top:1px solid #eee; padding-top:12px;">
      <button onclick="document.getElementById('stockReportEditorModal').style.display='none'" style="background:#777; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Cancel</button>
      <button id="btnExportStockReportPdf" style="background:#7b1fa2; color:#fff; border:none; padding:8px 20px; border-radius:4px; font-weight:bold; cursor:pointer;">🖨️ Export PDF</button>
      <button id="btnExportStockReportEmail" style="background:#2e7d32; color:#fff; border:none; padding:8px 20px; border-radius:4px; font-weight:bold; cursor:pointer;">📧 Copy to Email</button>
    </div>
  </div>
</div>
