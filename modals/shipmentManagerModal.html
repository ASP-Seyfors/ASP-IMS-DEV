<!-- =======================================================================
  * Allied Surgical Products - Inventory Management System
  * File: modals/shipmentManagerModal.html
  * Description: Final check window for outgoing orders. Pre-calculates 
  *              box dimensions and weights, and integrates with FedEx.
  ======================================================================= -->
<div id="shipmentManagerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
  <div style="background:var(--card-bg, #ffffff); border-radius:8px; width:100%; max-width:900px; max-height:95vh; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.6);">
    
    <!-- Modal Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #7b1fa2; padding:15px 20px; flex-shrink:0;">
      <h2 style="margin:0; color:#7b1fa2; display:flex; align-items:center; gap:8px;">
        <i data-lucide="package-check" style="width:24px; height:24px;"></i> Shipment Manager
      </h2>
      <button onclick="document.getElementById('shipmentManagerModal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main, #333);">&times;</button>
    </div>

    <!-- Scrollable Content -->
    <div style="overflow-y:auto; padding:20px; flex-grow:1;">
      
      <div style="display:flex; gap:20px; flex-wrap:wrap;">
        <!-- LEFT COLUMN: Customer & Logistics -->
        <div style="flex: 1; min-width: 300px; display:flex; flex-direction:column; gap:15px;">
          
          <div style="background:#f3e5f5; border:1px solid #ce93d8; border-radius:6px; padding:15px;">
            <h4 style="margin:0 0 10px 0; color:#4a148c; border-bottom:1px solid #ce93d8; padding-bottom:5px;">📋 Customer Shipping Rules</h4>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <div>
                <label style="font-size:0.8rem; font-weight:bold; color:#555;">Customer Account</label>
                <input type="text" id="shipCustName" class="form-input" style="background:#e0e0e0; font-weight:bold;" readonly>
              </div>
              <div style="display:flex; gap:8px;">
                <div style="flex:1;">
                  <label style="font-size:0.8rem; font-weight:bold; color:#555;">Carrier</label>
                  <select id="shipCarrier" class="form-input">
                    <option value="FEDEX">FedEx</option>
                    <option value="UPS">UPS</option>
                    <option value="USPS">USPS</option>
                  </select>
                </div>
                <div style="flex:1;">
                  <label style="font-size:0.8rem; font-weight:bold; color:#555;">Account Number</label>
                  <input type="text" id="shipAccountNum" class="form-input" placeholder="e.g. 208469018">
                </div>
              </div>
              <div>
                <label style="font-size:0.8rem; font-weight:bold; color:#555;">Special Instructions</label>
                <textarea id="shipNotes" class="form-input" rows="2" style="resize:vertical;" placeholder="e.g. They send label, give Trey weight/dims"></textarea>
              </div>
            </div>
          </div>

          <div style="background:#f9f9f9; border:1px solid #ccc; border-radius:6px; padding:15px;">
            <h4 style="margin:0 0 10px 0; color:#333; border-bottom:1px solid #ccc; padding-bottom:5px;">📍 Destination Address</h4>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
              <div style="grid-column: span 2;">
                <input type="text" id="shipAddressName" class="form-input" placeholder="Contact Name">
              </div>
              <div style="grid-column: span 2;">
                <input type="text" id="shipAddressCompany" class="form-input" placeholder="Company Name">
              </div>
              <div style="grid-column: span 2;">
                <input type="text" id="shipAddressStreet1" class="form-input" placeholder="Address Line 1">
              </div>
              <div style="grid-column: span 2;">
                <input type="text" id="shipAddressStreet2" class="form-input" placeholder="Address Line 2 (Suite, Floor, etc.)">
              </div>
              <div>
                <input type="text" id="shipAddressCity" class="form-input" placeholder="City">
              </div>
              <div style="display:flex; gap:8px;">
                <input type="text" id="shipAddressState" class="form-input" placeholder="State" style="width:60px;">
                <input type="text" id="shipAddressZip" class="form-input" placeholder="ZIP Code" style="flex:1;">
              </div>
              <div style="grid-column: span 2; display:flex; align-items:center; gap:10px; margin-top:5px;">
                <label style="font-size:0.85rem; font-weight:bold; display:flex; align-items:center; gap:4px; cursor:pointer;">
                  <input type="radio" name="shipAddressType" value="commercial" checked> Commercial
                </label>
                <label style="font-size:0.85rem; font-weight:bold; display:flex; align-items:center; gap:4px; cursor:pointer;">
                  <input type="radio" name="shipAddressType" value="residential"> Residential
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN: Package Math & Action -->
        <div style="flex: 1; min-width: 300px; display:flex; flex-direction:column; gap:15px;">
          
          <div style="background:#e3f2fd; border:1px solid #90caf9; border-radius:6px; padding:15px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #90caf9; padding-bottom:5px; margin-bottom:10px;">
              <h4 style="margin:0; color:#0277bd;">📦 Package Configuration</h4>
              <button class="btn-small" style="background:#0277bd; color:#fff; padding:2px 8px; font-size:0.7rem;" onclick="ShippingManager.recalculateBoxMath()">Auto-Recalculate</button>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div>
                <label style="font-size:0.8rem; font-weight:bold; color:#0277bd;">Calculated Box Size</label>
                <select id="shipBoxSize" class="form-input" style="font-weight:bold; font-size:1rem; color:#0277bd; border:2px solid #0277bd;" onchange="ShippingManager.handleBoxSizeChange()">
                  <option value="XS">Extra Small (8 x 8 x 8)</option>
                  <option value="S">Small (12 x 6 x 6)</option>
                  <option value="M">Medium (22 x 13 x 15)</option>
                  <option value="L">Large (27 x 15 x 17)</option>
                  <option value="CUSTOM">Custom Dimensions...</option>
                </select>
              </div>

              <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
                <div>
                  <label style="font-size:0.8rem; font-weight:bold; color:#555;">Length (in)</label>
                  <input type="number" id="shipDimL" class="form-input" value="8" style="text-align:center;">
                </div>
                <div>
                  <label style="font-size:0.8rem; font-weight:bold; color:#555;">Width (in)</label>
                  <input type="number" id="shipDimW" class="form-input" value="8" style="text-align:center;">
                </div>
                <div>
                  <label style="font-size:0.8rem; font-weight:bold; color:#555;">Height (in)</label>
                  <input type="number" id="shipDimH" class="form-input" value="8" style="text-align:center;">
                </div>
              </div>

              <div>
                <label style="font-size:0.8rem; font-weight:bold; color:#2e7d32; display:flex; justify-content:space-between;">
                  Estimated Weight (lbs)
                  <span id="shipWeightWarning" style="color:#d32f2f; font-size:0.7rem; display:none;">⚠️ Contains Non-Sutures</span>
                </label>
                <input type="number" id="shipWeight" class="form-input" step="0.1" value="0.0" style="font-size:1.2rem; font-weight:bold; color:#2e7d32; text-align:center; border:2px solid #2e7d32;">
              </div>
            </div>
          </div>

          <div style="background:#e8f5e9; border:1px solid #81c784; border-radius:6px; padding:15px; display:flex; flex-direction:column; gap:10px; flex-grow:1; justify-content:center;">
            <button id="btnPurchaseLabel" class="btn-action" style="background:#2e7d32; color:#fff; width:100%; font-size:1.1rem; padding:12px; margin:0; display:flex; align-items:center; justify-content:center; gap:8px;">
              <i data-lucide="printer" style="width:20px; height:20px;"></i> Purchase FedEx Label
            </button>
            <div style="display:flex; gap:10px;">
              <button id="btnLogTrackingOnly" class="btn-action" style="background:#0277bd; color:#fff; flex:1; font-size:0.9rem; padding:8px; margin:0;">
                Log Tracking Only
              </button>
              <button class="btn-action" style="background:#757575; color:#fff; flex:1; font-size:0.9rem; padding:8px; margin:0;" onclick="document.getElementById('shipmentManagerModal').style.display='none'">
                Skip
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
