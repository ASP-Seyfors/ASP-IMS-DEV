<body class="theme-gold">

  <!-- THE APP WILL INJECT ALL SCREENS INTO THIS EMPTY CONTAINER -->

  <!-- Scripts -->
   <script src="js/config.js"></script>
  <script src="js/componentManager.js"></script>
  <script src="js/databaseManager.js"></script>

  <script src="js/shippingManager.js"></script>
  <script src="js/traceability.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('Service Worker registered.');
          
          // Force an immediate check for updates on every load
          reg.update();

          // Triggered when a new Service Worker is found on the server
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showForceUpdateModal(reg);
              }
            };
          };

          // Triggered if an update is already waiting (e.g., they closed the browser previously without updating)
          if (reg.waiting) {
            showForceUpdateModal(reg);
          }
        }).catch(err => console.warn('Service Worker registration skipped or delayed:', err));
        
        // This fires when the new Service Worker takes control, automating the reload
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload(true);
          }
        });
      });
    }

    // THE INESCAPABLE UPDATE OVERLAY
    function showForceUpdateModal(reg) {
      let overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center; padding:20px; box-sizing:border-box;';
      overlay.innerHTML = `
          <div style="background:#fff; color:#333; padding:30px; border-radius:8px; max-width:400px; width:100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
              <h2 style="color:#c62828; margin-top:0;">⚠️ App Update Required</h2>
              <p style="font-size:0.95rem; color:#555; margin-bottom:20px;">A new version of the ASP Inventory System is available. You must update to continue using the application to prevent data corruption.</p>
              <button id="btnForceUpdateNow" style="background:#2e7d32; color:#fff; border:none; padding:15px; width:100%; font-size:1.1rem; font-weight:bold; border-radius:6px; cursor:pointer; margin-bottom:10px;">Update App Now</button>
              <button id="btnForceCloseApp" style="background:#757575; color:#fff; border:none; padding:10px; width:100%; font-size:0.9rem; font-weight:bold; border-radius:6px; cursor:pointer;">I'll Update Later (Close App)</button>
          </div>
      `;
      document.body.appendChild(overlay);
      
      // Update Button: Sends a command to sw.js to activate the new code immediately
      document.getElementById('btnForceUpdateNow').onclick = () => {
          document.getElementById('btnForceUpdateNow').innerText = "Updating... Please wait";
          if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
      };
      
      // Close Button: Attempts to shut down the browser window. If blocked by the OS, it wipes the UI.
      document.getElementById('btnForceCloseApp').onclick = () => {
          window.opener = null;
          window.open("", "_self");
          window.close();
          // Fallback if the browser blocks window.close()
          overlay.innerHTML = `<div style="text-align:center; padding:30px; background:#fff; border-radius:8px; max-width:400px;"><h2 style="color:#c62828; margin-top:0;">App Locked</h2><p style="color:#333;">Please manually close this browser tab or app window.</p></div>`;
      };
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</body>
