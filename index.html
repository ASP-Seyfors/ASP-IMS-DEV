 *   dynamic UI components.

 *   - External Library Loading (Html5-Qrcode, Tesseract.js, Showdown)

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASP DEV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/component.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="manifest" href="manifest.json">
  
  <!-- ✨ NEW: Placeholder meta tag for the dynamic theme color -->
  <meta name="theme-color" id="dynamicThemeColor" content="#ffffff">
  
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    #refInput, #lotInput, .manifest-ref-input { text-transform: uppercase; }
    .manifest-row { background: #ffffff; border: 1px solid #8b8589; border-radius: 4px; padding: 8px; margin-bottom: 8px; }
    .progress-banner { background-color: #e8f5e9; border: 2px solid #2e7d32; color: #1b5e20; padding: 8px; border-radius: 4px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    .badge-info { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 0.8rem; font-weight: bold; }
    .badge-alert { background-color: #ffcdd2; color: #c62828; }
    .audit-card { background-color: #ffffff; border: 1px solid #0277bd; border-radius: 4px; padding: 10px; margin-bottom: 10px; }    
  </style>
</head>
<body class="theme-gold">

  <!-- THE APP WILL INJECT ALL SCREENS INTO THIS EMPTY CONTAINER -->
  <div id="app-root"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  
  <!-- ✨ NEW: Instantly push the environment color to the browser header -->
  <script>
    if (typeof ENV_CONFIG !== 'undefined' && ENV_CONFIG.THEME_COLOR) {
      document.getElementById('dynamicThemeColor').content = ENV_CONFIG.THEME_COLOR;
    }
  </script>

  <script src="js/componentManager.js"></script>
  <script src="js/databaseManager.js"></script>
  <script src="js/uiManager.js"></script>
  <script src="js/scannerManager.js"></script>
  <script src="js/inventoryEngine.js"></script>
  <script src="js/sessionManager.js"></script>
  <script src="js/auditManager.js"></script>
  <script src="js/reportsManager.js"></script>
  <script src="js/authManager.js"></script>
  <script src="js/shippingManager.js"></script>
  <script src="js/shipmentTracker.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Native Service Worker Registration (Relies on Chrome's built-in update UI)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered natively.'))
          .catch(err => console.warn('Service Worker registration failed:', err));
      });
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Ethicon Monitor Modal -->
<div id="ethiconMonitorModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999999; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
  <div style="background:var(--card-bg, #ffffff); border-radius:8px; width:100%; max-width:600px; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.6);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #d32f2f; padding:15px 20px;">
      <h2 style="margin:0; color:#d32f2f; font-size:1.3rem; display:flex; align-items:center; gap:8px;">
        <i data-lucide="shield-alert" style="width:24px; height:24px;"></i> Ethicon Discontinue Monitor
      </h2>
      <button onclick="document.getElementById('ethiconMonitorModal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-main, #333);">&times;</button>
    </div>
    
    <div style="padding:20px; font-size:0.95rem; color:var(--text-main, #555);">
      
      <!-- LIVE SEARCH UI -->
      <div style="margin-bottom:20px;">
        <h4 style="margin:0 0 10px 0; color:#0277bd;">Live Catalog Search</h4>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <input type="text" id="ethiconSearchInput" class="form-input" placeholder="Search specific REF (e.g. CC41G)..." style="flex:1; text-transform:uppercase;">
          <button onclick="window.runEthiconUiScan('SEARCH')" style="background:#0277bd; color:#fff; border:none; border-radius:4px; padding:0 15px; font-weight:bold; cursor:pointer;">Search</button>
          <button onclick="window.runEthiconUiScan('FULL')" style="background:#f57f17; color:#fff; border:none; border-radius:4px; padding:0 15px; font-weight:bold; cursor:pointer; white-space:nowrap;">Scan Full Inventory</button>
        </div>
        <div id="ethiconUiResults" style="max-height:200px; overflow-y:auto; font-size:0.85rem; color:var(--text-main); border:1px solid #eee; padding:10px; border-radius:4px; background:#f9f9f9;">
          <div style="text-align:center; color:#777; font-style:italic;">Loading archived data...</div>
        </div>
      </div>

      <!-- SUBSCRIPTION UI -->
      <div style="background:rgba(211, 47, 47, 0.1); border:1px solid #d32f2f; border-radius:6px; padding:15px; margin-top:20px;">
        <h4 style="margin:0 0 10px 0; color:#d32f2f;">Subscribe to Monthly Email Reports</h4>
        <div style="display:flex; gap:8px; align-items:flex-end;">
          <div style="flex:1;">
            <label style="font-size:0.8rem; font-weight:bold; color:var(--text-main);">Email Address</label>
            <input type="email" id="ethiconMonitorEmail" class="form-input" placeholder="name@domain.com">
          </div>
          <button id="btnSubscribeEthicon" onclick="window.subscribeToEthiconMonitor()" style="background:#d32f2f; color:#fff; border:none; border-radius:4px; height:36px; padding:0 15px; font-weight:bold; cursor:pointer; white-space:nowrap;">Subscribe</button>
        </div>
        
        <div style="margin-top:15px; padding-top:10px; border-top:1px dashed #d32f2f;">
          <label style="font-size:0.8rem; font-weight:bold; color:var(--text-main);">Current Subscribers:</label>
          <div id="ethiconSubList" style="font-size:0.85rem; max-height:80px; overflow-y:auto; color:var(--text-main); margin-top:4px;">
            <i>Loading...</i>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
