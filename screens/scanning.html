<!-- =======================================================================
 * Allied Surgical Products - Inventory Management System
 * File: screens/scanning.html (Modern SaaS Redesign)
 * ======================================================================= -->
<div id="screenScanning" style="display: none;" class="saas-scanning-container">
  
  <!-- 1. Active Session Command Header -->
  <div class="scanning-header-card">
    <div class="scanning-meta-group">
      <div class="session-badge-wrapper">
        <span id="hdrWorkflow" class="saas-workflow-pill">Workflow</span>
        <span class="operator-tag"><i data-lucide="user" style="width:12px; height:12px; vertical-align:text-bottom;"></i> <span id="hdrUser">--</span></span>
      </div>
      <h3 id="hdrTitle" class="scanning-session-title">Customer (Order)</h3>
    </div>
    <div class="scanning-header-right">
      <div class="session-time-block">
        <span><strong>Date:</strong> <span id="hdrDate">--</span></span>
        <span><strong>Started:</strong> <span id="hdrTime">--</span></span>
      </div>
      <button class="btn-saas-review" onclick="goToSummaryScreen()" title="Finish scanning and proceed to session summary">
        <i data-lucide="clipboard-check" style="width:16px; height:16px; vertical-align:middle; margin-right:6px;"></i> Review Session
      </button>
    </div>
  </div>

  <!-- Manifest Progress Banner -->
  <div id="manifestProgressBanner" class="saas-progress-banner" style="display:none;">
    <div class="progress-info-text">
      <span>Order Progress: <strong id="manifestScannedQty">0</strong> / <strong id="manifestTotalQty">0</strong> Expected</span>
      <span id="manifestUnexpectedStats"></span>
    </div>
    <div class="progress-track-bar">
      <div id="manifestBarFill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>
  </div>

  <div class="scanning-workspace-grid">
    
    <!-- LEFT COLUMN: Camera Viewfinder & Raw Barcodes -->
    <div class="workspace-left-col">
      <div class="saas-card scanner-capture-card">
        <div class="flex-between" style="margin-bottom: 12px;">
          <div class="card-section-title" style="margin:0;"><i data-lucide="scan-barcode" style="width:16px; height:16px; vertical-align:middle; margin-right:6px;"></i>Barcode Capture</div>
          <div style="display:flex; gap:6px;">
            <button class="btn-saas-sub" onclick="resetScanLinesAndFields()" title="Clear all raw barcode inputs">Clear</button>
            <button class="btn-saas-cam-toggle" id="btnToggleCam" onclick="toggleCameraScanner()">
              <i data-lucide="camera" style="width:14px; height:14px; vertical-align:middle; margin-right:4px;"></i>Camera
            </button>
          </div>
        </div>

        <!-- Camera Viewfinder Box -->
        <div id="cameraContainer" class="camera-container-box">
          <div class="cam-status-overlay">
            <span id="tagGtin" class="status-tag">GTIN</span>
            <span id="tagLot" class="status-tag">LOT</span>
            <span id="tagExp" class="status-tag">EXP</span>
            <button class="btn-saas-snap" onclick="ScannerManager.captureViewfinderFrame()">
              <i data-lucide="camera" style="width:13px; height:13px;"></i> Snap
            </button>
          </div>
          <div id="cameraViewfinder"></div>
        </div>

        <!-- Raw Barcode Input Lines -->
        <div class="raw-lines-wrapper">
          <div class="form-row-saas" id="rowScan1">
            <label class="saas-label">Barcode Line 1</label>
            <input type="text" id="rawScan1" class="saas-input font-mono" placeholder="Scan Primary Barcode" oninput="processAllScans()">
          </div>
          <div class="form-row-saas" id="rowScan2" style="display: none;">
            <label class="saas-label">Barcode Line 2</label>
            <input type="text" id="rawScan2" class="saas-input font-mono" placeholder="Scan Secondary Barcode" oninput="processAllScans()">
          </div>
          <div class="form-row-saas" id="rowScan3" style="display: none;">
            <label class="saas-label">Barcode Line 3</label>
            <input type="text" id="rawScan3" class="saas-input font-mono" placeholder="Scan Tertiary Barcode" oninput="processAllScans()">
          </div>
          <div class="form-row-saas" id="rowScan4" style="display: none;">
            <label class="saas-label">Barcode Line 4</label>
            <input type="text" id="rawScan4" class="saas-input font-mono" placeholder="Scan 4th Barcode" oninput="processAllScans()">
          </div>
          
          <div style="text-align: center; margin-top: 6px;">
            <button class="btn-saas-sub" id="btnAddLine" onclick="addScanLine()">+ Add Barcode Line</button>
          </div>
        </div>
      </div>

      <!-- Pinned Expected Items Tracker -->
      <div id="liveManifestTracker" class="saas-card manifest-tracker-card" style="display:none;">
        <div class="tracker-header">
          <span><i data-lucide="clipboard-list" style="width:15px; height:15px; vertical-align:middle; margin-right:6px;"></i>Expected Items Tracker</span>
        </div>
        <div id="liveManifestList" class="tracker-list-scroll"></div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Parsed Details & Manual Lookup -->
    <div class="workspace-right-col">
      <div class="saas-card parsed-details-card">
        <div class="card-section-title"><i data-lucide="file-text" style="width:16px; height:16px; vertical-align:middle; margin-right:6px;"></i>Parsed Item Details</div>

        <!-- Manual REF Lookup -->
        <div class="lookup-box-saas">
          <label class="saas-label">REF / SKU Manual Lookup</label>
          <input list="dbRefs" type="text" id="refInput" class="saas-input input-highlight" placeholder="Scan or Type REF" oninput="this.value = this.value.toUpperCase(); runMasterLookup();">
          <datalist id="dbRefs"></datalist>
        </div>

        <!-- Live Database Match Banner -->
        <div id="liveMatchPreview" class="match-preview-box-saas" style="display: none;">
          <div class="match-success-title"><i data-lucide="check-circle-2" style="width:14px; height:14px; vertical-align:text-bottom;"></i> Database Match Found</div>
          <div id="prevDescText" class="match-desc-text">--</div>
        </div>

        <!-- Item Destination Selector -->
        <div class="form-row-saas" id="rowItemDestination" style="display: none;">
          <label class="saas-label">Item Destination</label>
          <div class="action-selector-saas">
            <div id="actBtnInv" class="action-btn-saas selected-inv" onclick="setItemAction('Inventory')">Inventory</div>
            <div id="actBtnRes" class="action-btn-saas" onclick="setItemAction('Reserved')">Reserved</div>
          </div>
        </div>

        <!-- Customer Tag Container -->
        <div class="form-row-saas" id="rowCustomerTag" style="display: none; background: rgba(2, 119, 189, 0.06); padding: 10px; border-radius: 6px; border: 1px dashed #0277bd;">
          <label class="saas-label" style="color: #0277bd;">Customer Allocation Tag</label>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; gap: 6px;">
              <select id="itemCustomerSelect" class="saas-select" style="flex: 1;" onchange="handleItemCustomerSelect(this.value); SessionManager.populateCustomerOrdersDropdown(this.value)"></select>
              <input type="text" id="itemOrderNumInput" class="saas-input" placeholder="PO / Order #" style="flex: 1;">
            </div>
            <select id="itemKnownOrdersSelect" class="saas-select" style="display:none;" onchange="if(this.value) document.getElementById('itemOrderNumInput').value = this.value;">
                <option value="">-- Known Orders (Select to Auto-Fill) --</option>
            </select>
          </div>
        </div>

        <!-- Quantity -->
        <div class="form-row-saas">
          <label class="saas-label">Quantity Scanned</label>
          <input type="number" id="qtyInput" value="1" min="0" class="saas-input" style="max-width: 100px; text-align: center;">
        </div>

        <!-- Form Inputs Grid -->
        <div class="form-row-saas">
          <label class="saas-label">Manufacturer / Vendor</label>
          <select id="vendorSelect" class="saas-select needs-attention" onchange="handleVendorSelect(this.value); evaluateFieldAttention();"></select>
        </div>

        <div class="form-row-saas">
          <label class="saas-label">GTIN Barcode</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="gtinInput" class="saas-input needs-attention font-mono" placeholder="GTIN" oninput="runMasterLookup(); evaluateFieldAttention();">
            <label class="checkbox-na-label"><input type="checkbox" id="chkNaGtin" onchange="toggleNA('gtinInput', 'chkNaGtin')"> N/A</label>
          </div>
        </div>

        <div class="form-row-saas">
          <label class="saas-label">Lot Number</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="lotInput" class="saas-input needs-attention font-mono" placeholder="Lot" oninput="evaluateFieldAttention();">
            <label class="checkbox-na-label"><input type="checkbox" id="chkNaLot" onchange="toggleNA('lotInput', 'chkNaLot')"> N/A</label>
          </div>
        </div>

        <div class="form-row-saas">
          <label class="saas-label">Version / Variant</label>
          <input type="text" id="verInput" class="saas-input font-mono" placeholder="e.g. 01">
        </div>

        <div class="form-row-saas">
          <label class="saas-label">Expiration Date</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="expInput" class="saas-input needs-attention font-mono" placeholder="YYYY-MM-DD" onchange="formatExpDate(this)" oninput="evaluateFieldAttention();">
            <label class="checkbox-na-label"><input type="checkbox" id="chkNaExp" onchange="toggleNA('expInput', 'chkNaExp')"> N/A</label>
          </div>
          <span id="expDateWarningBadge" style="display:none; margin-top:4px;"></span>
        </div>

        <div class="form-row-saas">
          <label class="saas-label">Shelf Location</label>
          <input type="text" id="shelfInput" class="saas-input font-mono" placeholder="e.g. A-14" style="text-transform:uppercase;">
        </div>

        <!-- Item Note Toggle -->
        <div style="margin: 10px 0;">
          <label style="font-size:0.8rem; font-weight:700; color:#d32f2f; cursor:pointer;">
            <input type="checkbox" id="chkItemNote" onchange="toggleItemNote()"> <i data-lucide="triangle-alert" style="width:13px; height:13px; vertical-align:middle; margin-right:4px;"></i>Add Item Issue / Note
          </label>
        </div>
        <div class="form-row-saas" id="rowItemNote" style="display:none;">
          <label class="saas-label" style="color:#d32f2f;">Note Details</label>
          <input type="text" id="itemNoteInput" class="saas-input" placeholder="e.g. Box crushed...">
        </div>

        <!-- Bottom Action Buttons -->
        <div class="scanning-actions-footer">
          <button class="btn-saas-secondary" onclick="resetScanLinesAndFields()">Clear Fields</button>
          <button class="btn-saas-primary" style="margin-top:0; flex:2;" onclick="goToReviewStage()">Continue to Verify ➔</button>
        </div>

      </div>
    </div>
  </div>
</div>
