<!-- MANIFEST REVIEW & VERIFICATION -->
<div id="screenManifestReview" style="display: none;" class="card">
  <h2>Verify Expected Order</h2>
  
  <div id="manifestReviewSummaryContainer">
    <!-- Summary Injected via JS -->
  </div>

  <div class="flex-between" style="margin-top: 16px;">
    <button class="btn-action btn-auto" style="background-color: #f57f17; color: #ffffff; margin:0;" onclick="returnToManifestEdit()"><i data-lucide="arrow-left" style="width:16px; height:16px; vertical-align:middle; margin-right:4px;"></i>Return to Pre-Loading</button>
    <button class="btn-action btn-save btn-auto" style="margin:0;" onclick="confirmManifestAndStart()"><i data-lucide="check-circle" style="width:16px; height:16px; vertical-align:middle; margin-right:4px;"></i>Confirm & Begin Scanning</button>
  </div>
</div>
