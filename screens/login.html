<!-- LOGIN & AUTHENTICATION -->
<div id="screenLogin" style="display: none; height: 90vh; justify-content: center; align-items: center; flex-direction: column;">
  <div class="card" style="width: 100%; max-width: 400px; text-align: center; padding: 30px 20px;">
    <img src="ASP_Box_Web_RGB.png" style="max-height: 80px; margin-bottom: 20px;" alt="ASP Logo" />
    <h2 style="justify-content: center; border: none; color: #0277bd; font-size: 1.3rem;">Allied Surgical Products</h2>
    <p style="font-size: 0.9rem; color: #555; margin-bottom: 25px;">Please sign in with your corporate workspace account to access warehouse tools.</p>
    
    <div id="googleAuthButton" style="display: flex; justify-content: center; margin-bottom: 20px; min-height: 40px;"></div>
    
    <div style="border-top: 1px solid #ccc; margin: 20px 0;"></div>
    
    <button class="btn-action btn-auto" style="background-color: #757575; color: #fff; width: 100%;" onclick="AuthManager.continueAsGuest()">Continue as Guest Scanner</button>
  </div>
</div>
