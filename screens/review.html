<!-- VERIFICATION & REVIEW PHASE -->
<div id="screenReview" style="display: none;">
  
  <div class="header-banner">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="text-align: left; font-size: 0.85rem; width: 25%;"><strong>User:</strong><br><span id="hdrUserRev">--</span></div>
      <div style="text-align: center; width: 50%;">
        <h3 id="hdrTitleRev" style="margin: 0; font-size: 1.1rem; color: #0277bd;">Customer (Order)</h3>
        <div id="hdrWorkflowRev" style="font-size: 0.85rem; font-weight: bold; color: #555; margin-top: 4px;">Workflow</div>
      </div>
      <div style="text-align: right; font-size: 0.85rem; width: 25%;">
        <strong>Date:</strong> <span id="hdrDateRev">--</span><br><strong>Start:</strong> <span id="hdrTimeRev">--</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Verify Item Details</h2>

    <div class="verify-card">
      <div class="verify-data-grid">
        <div style="grid-column: 1 / -1; border: 2px solid #0277bd;">
          <span>REF / SKU</span>
          <strong id="revRef" style="font-size: 1.3rem; color: #0277bd;">--</strong>
        </div>
        <div>
          <span>Lot Number</span>
          <strong id="revLot">--</strong>
        </div>
        <div>
          <span>Expiration Date</span>
          <strong id="revExp">--</strong>
        </div>
        <div id="revActionContainer">
          <span>Destination</span>
          <strong id="revAction" style="color:#2e7d32;">Inventory</strong>
        </div>
        <div>
          <span>Quantity</span>
          <strong id="revQty" style="font-size: 1.3rem;">1</strong>
        </div>
      </div>
      
      <div id="revCustomerTagRow" style="display:none; background-color:#e3f2fd; padding:8px; border:1px dashed #0277bd; border-radius:4px; margin-bottom:10px;">
        <span style="font-size:0.8rem; color:#0277bd; display:block; margin-bottom: 6px;">Customer / Order Tag:</span>
        <strong id="revCustomerTag" style="color:#0277bd;">--</strong>
      </div>
      
      <div id="revItemNoteRow" style="display:none; background-color:#ffebee; padding:8px; border:1px dashed #c62828; border-radius:4px;">
        <span style="font-size:0.8rem; color:#d32f2f; display:block;">Item Note: </span>
        <strong id="revItemNote" style="color:#d32f2f;">--</strong>
      </div>
    </div>

    <!-- Secondary info compressed -->
    <div style="font-size: 0.85rem; color: #555; margin-bottom: 15px;">
      <div style="margin-bottom: 4px;"><strong>Manufacturer:</strong> <span id="revMfr">--</span></div>
      <div style="margin-bottom: 4px;"><strong>GTIN:</strong> <span id="revGtin">--</span></div>
      <div style="margin-bottom: 4px;"><strong>Desc:</strong> <span id="revDesc">--</span></div>
    </div>

    <!-- Bundle / Box Creation Toggle -->
    <div style="text-align: left; width: 100%; margin-bottom: 10px; margin-top: 10px;">
      <label style="font-size:0.85rem; font-weight:bold; color:#00796b; cursor:pointer;" title="Mark this barcode as a Box or Bundle containing multiple individual units.">
        <input type="checkbox" id="chkIsBundle" onchange="document.getElementById('rowBundleData').style.display = this.checked ? 'flex' : 'none';"> <i data-lucide="package-plus" style="width:14px; height:14px; vertical-align:middle; margin-right:4px;"></i>Is this a Box / Bundle?
      </label>
    </div>
    <div id="rowBundleData" style="display:none; background-color:#e0f2f1; padding:8px; border:1px dashed #00796b; border-radius:4px; margin-bottom:15px; flex-direction:row; gap:6px;">
      <input type="text" id="bundleParentRef" placeholder="Parent REF (Individual SKU)" style="flex: 2; padding: 6px; text-transform:uppercase; border:1px solid #ccc; border-radius:4px;">
      <input type="number" id="bundleMult" placeholder="Units Per Box" min="2" style="flex: 1; padding: 6px; text-align:center; border:1px solid #ccc; border-radius:4px;">
    </div>

    <!-- Buttons -->
    <div id="gtinDiffBanner" class="gtin-diff-banner" style="display:none; padding:8px; margin-bottom:10px; font-size:0.9rem;"></div>
    
    <div id="updateActionsRow" style="display: flex; justify-content: center; gap: 15px; margin-bottom: 10px;">
        <button class="btn-action btn-auto" id="btnConfirmMfr" style="display:none; background-color: #c62828; color: #ffffff; padding: 10px 20px;" onclick="SessionManager.confirmFieldUpdate('mfr')"><i data-lucide="refresh-cw" style="width:16px; height:16px; vertical-align:middle; margin-right:4px;"></i>Update MFR</button>
        <button class="btn-action btn-auto" id="btnConfirmGtin" style="display:none; background-color: #c62828; color: #ffffff; padding: 10px 20px;" onclick="SessionManager.confirmFieldUpdate('gtin')"><i data-lucide="refresh-cw" style="width:16px; height:16px; vertical-align:middle; margin-right:4px;"></i>Update GTIN</button>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
      <button class="btn-action btn-auto" style="background-color: #f57f17; color: #ffffff; width:100%;" onclick="SessionManager.returnToEdit()" title="Go back to the scanning screen to fix a mistake before saving.">Return to Edit Item Details</button>
    </div>
    <div class="flex-between" style="gap: 8px;">
      <button class="btn-action btn-cancel btn-auto" style="flex:1;" onclick="SessionManager.cancelScannedItem()" title="Discard this scan completely.">Cancel Item</button>
      <button class="btn-action btn-save btn-auto" style="flex:1;" onclick="SessionManager.saveItemLog()" title="Confirm and log this item to the current session.">Save Item</button>
    </div>
  </div>
</div>
